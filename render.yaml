services:
  - type: web
    name: most
    runtime: static
    buildCommand: "echo no build step for static site"
    staticPublishPath: ./most-site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /projects.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /admin.html
        name: Cache-Control
        value: no-cache, must-revalidate
    routes:
      - type: rewrite
        source: /
        destination: /index.html
