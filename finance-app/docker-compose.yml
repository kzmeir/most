# Docker для MostServer (Synology, Container Manager) и любого другого сервера с Docker.
# Без сборки образа: код монтируется в готовый node:24-alpine (сервер без npm-зависимостей).
# node:24, а не 22 — база на встроенном node:sqlite (data/db.sqlite), в 24-й он без экспериментального флага.
# Инструкция сисадмину — docs/DEPLOY.md. Два сайта одним процессом (docs/ARCHITECTURE.md, «Два сайта»):
#   PORT=3000 «Финансы» — только офис, наружу НЕ пробрасывается через туннель.
#   ERP_PORT=3001 «MOST ERP» — модули; это единственный сайт, на который заводится Cloudflare Tunnel.
# Порты 5000/5001 заняты DSM — не трогать.
services:
  most-finance:
    image: node:24-alpine
    container_name: most-finance
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      # ВАЖНО: источник тома — локальный диск NAS, не смонтированная сетевая папка (SMB/CIFS)!
      # SQLite в режиме WAL требует блокировок файловой системы, которых сетевые шары не дают надёжно.
      - .:/app
      # Сетевые папки проектов для «Материалов» на досках — только чтение. Пути слева поправьте под NAS/сервер
      # (на Synology: /volume1/<общая папка>; если папка на другом NAS — сначала смонтируйте её на хосте).
      # - /volume1/MOST-2025:/mnt/most-2025:ro     # Y: = \SynologyMost\MOST-2025 (концепции, ЭП, архив)
      # - /volume1/Projects:/mnt/projects:ro       # Z: = \MostServer\Projects (рабочие проекты)
    ports:
      - "${PORT:-3000}:3000"       # Финансы — открывать только в офисной сети (маршрутизатор/файрвол), не наружу
      - "${ERP_PORT:-3001}:3001"   # MOST ERP — этот порт (или только его туннель) можно открывать наружу
    environment:
      - PORT=3000
      - ERP_PORT=3001
      - TZ=Asia/Almaty
      - RESTART_ON_VERSION=1       # после выкладки (изменился файл VERSION) процесс выходит, Docker поднимает новый код
      - NAME_PORT=0                # адреса по имени (fin.most / erp.most на порту 80) в Docker не нужны; 0 — выключить
      # Корни сетевых папок для досок (id|алиас|путь в контейнере|стадии) — раскомментируйте вместе с томами выше:
      # - BOARD_ROOTS=y|Y:|/mnt/most-2025|ep,concept;z|Z:|/mnt/projects|rp
      # - DATA_DIR=/app/data-prod   # раскомментируйте, если база должна лежать отдельно от кода приложения
      # DEV_USER здесь не задавайте никогда — это отключает пароли и раздельность сайтов (см. docs/DEPLOY.md)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Мост WhatsApp -> ERP (services/wa-bridge): читает номер-архивариус и передаёт группы в «Проекты», личные сообщения — в «Коммерцию».
  # Единственная служба со сторонней библиотекой (baileys из npm, ставится при первом запуске — нужен интернет). Сам в WhatsApp не пишет.
  # Включить: задать номер архивариуса в .env рядом с этим файлом (WA_PHONE=7701XXXXXXX, только цифры) и поднять проект заново.
  # Первый запуск: 1) в ERP «Настройки» -> «Ключи для ИИ» подтвердить ключ «WhatsApp-мост» по коду из журнала службы;
  #                2) код привязки появится в ERP: раздел «WhatsApp» -> ввести его в WhatsApp архивариуса («Связанные устройства» -> «Привязать по номеру»).
  # Данные службы (сессия WhatsApp и ключ ERP) — data/wa; при потере привязку надо повторить.
  wa-bridge:
    image: node:24-alpine
    container_name: most-wa-bridge
    profiles: ["whatsapp"]          # не стартует, пока профиль не включён (COMPOSE_PROFILES=whatsapp в .env)
    working_dir: /app/services/wa-bridge
    command: ["sh", "-c", "[ -d node_modules/baileys ] || npm ci --omit=dev --no-audit --no-fund; exec node index.mjs"]
    volumes:
      - ./services/wa-bridge:/app/services/wa-bridge
      - ./data/wa:/app/services/wa-bridge/data
    environment:
      - ERP_URL=http://most-finance:3001
      - FIN_URL=http://most-finance:3000
      - WA_PHONE=${WA_PHONE:-}
      - TZ=Asia/Almaty
    restart: unless-stopped
    depends_on:
      - most-finance

  # Необязательно: постоянный адрес через Cloudflare Tunnel вместо start-internet.bat.
  # Публичный хост в туннеле — ТОЛЬКО most-finance:3001 (сайт ERP). Финансы (3000) в туннель не заводить.
  # 1) Cloudflare Zero Trust → Networks → Tunnels → Create a tunnel → скопируйте токен.
  # 2) Публичный хост в туннеле: сервис http://most-finance:3001 (имя контейнера + порт ERP в этой docker-сети).
  # 3) Положите токен в .env рядом с этим файлом: CLOUDFLARE_TUNNEL_TOKEN=...
  # 4) Раскомментируйте блок ниже и выполните: docker compose up -d
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: most-finance-tunnel
  #   command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   restart: unless-stopped
  #   depends_on:
  #     - most-finance
